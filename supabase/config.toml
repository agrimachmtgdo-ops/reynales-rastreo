# Configuración para desarrollo local con la CLI de Supabase (opcional).
# En la nube, estos ajustes se hacen en el panel de Supabase (ver docs/GUIA-CONFIGURACION.md).
project_id = "reynales-rastreo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Los choferes entran con sesión anónima + código de invitación.
enable_anonymous_sign_ins = true
# El personal NO se registra solo: el administrador crea las cuentas.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
